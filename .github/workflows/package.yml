name: Development packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows
            arch: amd64
          - runner: macos-15
            target: darwin
            arch: arm64
          - runner: macos-15-intel
            target: darwin
            arch: amd64
          - runner: ubuntu-latest
            target: linux
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify native build architecture
        shell: bash
        env:
          IMAGEPORT_ARCH: ${{ matrix.arch }}
        run: test "$(go env GOHOSTARCH)" = "$IMAGEPORT_ARCH"
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Check behavior and source standards
        run: |
          go run ./tools/check
          go test -tags ci ./...
      - name: Create development package with pinned Fyne tooling
        shell: bash
        env:
          IMAGEPORT_TARGET: ${{ matrix.target }}
        run: |
          go run fyne.io/tools/cmd/fyne@v1.7.4 package --src ./cmd/client --target "$IMAGEPORT_TARGET" --name ImagePort --app-id io.github.imneov.ImagePort --icon "$GITHUB_WORKSPACE/assets/icon.png"
      - name: Preserve macOS application permissions in an archive
        if: runner.os == 'macOS'
        env:
          IMAGEPORT_ARCH: ${{ matrix.arch }}
        run: tar -czf "ImagePort-macos-${IMAGEPORT_ARCH}.tar.gz" ImagePort.app
      - name: Upload unsigned development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImagePort-${{ matrix.target }}-${{ matrix.arch }}-unsigned
          path: |
            **/ImagePort.exe
            **/ImagePort-macos-*.tar.gz
            **/ImagePort.tar.xz
            **/ImagePort.tar.gz
            **/ImagePort.zip
          if-no-files-found: error
